<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FinCalcLens — Smart Financial Calculators</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="app">
        <main class="main">
            <div class="topbar">
                <div class="title" id="homeBtn" style="cursor:pointer">FinCalcLens — Calculators</div>
                <div class="search">
                    <input id="searchBoxSide" placeholder="Search calculators..." />
                </div>
            </div>

            <!-- Category Tabs -->
            <div id="categoryArea">
                <div class="tabs" id="categoryTabs"></div>
                <div id="subCategoryGrid" class="cards" style="margin-top:12px"></div>
            </div>

            <!-- Calculator view (hidden until a calculator is opened) -->
            <div id="calculatorView" class="calculator-view">
                <!-- content injected here by JS -->
            </div>

            <footer>Made with ❤️ — FinCalcLens</footer>
        </main>
    </div>

    <script src="js/app.js" defer></script>
</body>

</html>
